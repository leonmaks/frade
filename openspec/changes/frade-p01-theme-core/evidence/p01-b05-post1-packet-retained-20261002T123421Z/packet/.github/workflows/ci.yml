name: CI

on:
  push:
  pull_request:

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: git diff --exit-code -- pnpm-lock.yaml
      - run: pnpm check

  draw-chromium-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @frade/draw exec playwright install chromium
      - name: UI fresh-checkout byte preservation
        run: pnpm ui:checkout:check
      - run: pnpm test:e2e
      - name: Standalone UI token cascade
        run: pnpm --filter @frade/desktop exec playwright test tests/e2e/ui-contract-token-cascade.spec.ts
      - run: pnpm test:desktop
      - name: Upload Playwright failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: draw-playwright-windows
          if-no-files-found: ignore
          path: |
            packages/draw/test-results/
            packages/draw/playwright-report/
            apps/desktop/test-results/
            apps/desktop/playwright-report/

  ui-compliance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: git diff --exit-code -- pnpm-lock.yaml
      - run: pnpm ui:compliance > ui-compliance.log 2>&1
      - name: Upload UI compliance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-compliance
          path: ui-compliance.log
