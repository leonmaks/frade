name: CI

on:
  push:
  pull_request:

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: git diff --exit-code -- pnpm-lock.yaml
      - run: pnpm check

  draw-chromium-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @frade/draw exec playwright install chromium
      - run: pnpm test:e2e
      - run: pnpm test:desktop
      - name: Upload Playwright failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: draw-playwright-windows
          if-no-files-found: ignore
          path: |
            packages/draw/test-results/
            packages/draw/playwright-report/
            apps/desktop/test-results/
            apps/desktop/playwright-report/
